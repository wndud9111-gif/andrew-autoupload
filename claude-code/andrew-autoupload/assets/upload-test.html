<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'"><title>로컬 이미지 첨부 점검</title><style>body{font:20px sans-serif;max-width:700px;margin:60px auto;padding:20px}img{max-width:300px}label{display:block;padding:25px;background:#edf1e8}textarea{display:block;width:100%;height:90px}</style><h1>외부 전송 없는 첨부 점검</h1><p>브라우저 도구로 파일 입력 요소에 테스트 PNG를 연결하세요. 선택창 버튼을 클릭하지 않습니다.</p><label>첨부 대상: 테스트 이미지<input id="upload" type="file" accept="image/png,image/jpeg" hidden></label><p id="status" role="status">아직 첨부되지 않음</p><img id="preview" alt="첨부 이미지 미리보기" hidden><label for="caption">입력 점검</label><textarea id="caption" placeholder="연결 확인"></textarea><script>let last;document.getElementById('upload').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const p=document.getElementById('preview'),s=document.getElementById('status');if(last)URL.revokeObjectURL(last);last=URL.createObjectURL(f);p.onload=()=>{s.textContent=`미리보기 확인: ${f.name}, ${f.size} bytes, ${p.naturalWidth}×${p.naturalHeight}`;p.hidden=false};p.onerror=()=>{s.textContent='이미지 미리보기 실패';p.hidden=true};p.src=last});</script></html>
